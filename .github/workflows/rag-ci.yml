name: RAG CI

on:
  push:
    paths:
      - "rag_backend/**"
      - "supabase/migrations/**"
      - ".github/workflows/rag-ci.yml"
  pull_request:
    paths:
      - "rag_backend/**"
      - "supabase/migrations/**"
      - ".github/workflows/rag-ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag_backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rag_backend/requirements-ci.txt

      - name: Install test dependencies
        run: pip install -r requirements-ci.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
