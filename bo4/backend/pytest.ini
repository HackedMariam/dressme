[pytest]
testpaths = tests
pythonpath = .
addopts = --strict-markers
xfail_strict = true
markers =
    characterization: fige le comportement actuel du moteur BO4 (défauts compris)
    desired: comportement cible d'un défaut confirmé (xfail strict tant qu'il n'est pas corrigé)
    design_hypothesis: hypothèse de conception à évaluer, pas un bug confirmé (xfail strict)
    db: intégration PostgreSQL optionnelle, en lecture seule (ignorée sans POSTGRES_PASSWORD)
    hm_images: a besoin des vraies images H&M de bo4/data/ (ignoré par git) ; ignoré sans elles
